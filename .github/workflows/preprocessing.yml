name: Automated Data Preprocessing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run automated preprocessing
        run: |
          python preprocessing/automate_Mursyid-Dwi-Wahidiyantoro.py

      - name: Verify preprocessed output
        run: |
          test -f preprocessing/heart_preprocessing.csv
          echo "Preprocessing output verified successfully!"
